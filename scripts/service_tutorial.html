<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Horekia · Crear un servicio</title>
  <style>
    :root { --ink:#17332d; --muted:#52645b; --green:#258269; --line:#dbe6df; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:1280px; height:720px; overflow:hidden; font-family:Arial,sans-serif; background:#f4f7f5; color:var(--ink); }
    body { display:flex; align-items:center; justify-content:center; }
    .scene { width:1280px; height:720px; padding:40px 56px; position:relative; background:linear-gradient(135deg,#f8fbf9,#e8f4ed); }
    .top { display:flex; justify-content:space-between; align-items:center; }
    .brand { color:var(--green); font-size:18px; letter-spacing:4px; font-weight:800; }
    .count { color:var(--muted); font-size:16px; font-weight:700; }
    .instruction { margin-top:30px; background:var(--ink); border-radius:14px; padding:24px 30px; color:#fff; font-size:30px; line-height:1.2; font-weight:800; box-shadow:0 8px 20px rgba(23,51,45,.12); }
    .sub { color:var(--muted); font-size:17px; margin-top:12px; }
    .shot { position:absolute; left:56px; right:56px; top:230px; bottom:34px; border:1px solid var(--line); background:#fff; border-radius:14px; display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:0 12px 30px rgba(23,51,45,.10); }
    .shot img { display:block; max-width:100%; max-height:100%; object-fit:contain; }
    .shot.one img { width:850px; }
    .shot.two img { width:1110px; }
    .shot.three img { width:1110px; }
    .shot.four img { width:1080px; height:100%; object-fit:contain; object-position:center; }
    .callout { position:absolute; background:#fff2b8; color:#5b4b16; border:2px solid #e4c85e; border-radius:10px; padding:10px 15px; font-size:16px; font-weight:800; box-shadow:0 5px 12px rgba(91,75,22,.15); }
    .callout.one { right:136px; top:300px; }
    .callout.two { right:164px; top:295px; }
    .callout.three { right:126px; top:295px; }
    .callout.four { right:92px; top:282px; }
    .footer { position:absolute; left:56px; bottom:10px; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const scenes = [
      { html: `<div class="scene"><div class="top"><div class="brand">HOREKIA · SERVICIOS</div><div class="count">1 / 4</div></div><div class="instruction">Pulsa «Crear un servicio», ponle un nombre y una descripción.</div><div class="sub">El slug se genera automáticamente: no tienes que escribirlo.</div><div class="shot one"><img src="video-assets/story-1-add-service.png" /></div><div class="callout one">1 · Nombre y descripción</div><div class="footer">Tutorial visual · Datos ficticios · Sin voz</div></div>` },
      { html: `<div class="scene"><div class="top"><div class="brand">HOREKIA · SERVICIOS</div><div class="count">2 / 4</div></div><div class="instruction">Tu servicio ya aparece en «Servicios configurados».</div><div class="sub">Comprueba que el nombre y el slug automático se han guardado correctamente.</div><div class="shot two"><img src="video-assets/story-2-design-button.png" /></div><div class="callout two">2 · Servicio creado</div><div class="footer">Tutorial visual · Datos ficticios · Sin voz</div></div>` },
      { html: `<div class="scene"><div class="top"><div class="brand">HOREKIA · SERVICIOS</div><div class="count">3 / 4</div></div><div class="instruction">Abre el servicio creado pulsando «Diseñar».</div><div class="sub">Desde aquí podrás configurar cómo se presupuesta ese producto o trabajo.</div><div class="shot three"><img src="video-assets/story-2-design-button.png" /></div><div class="callout three">3 · Pulsa Diseñar</div><div class="footer">Tutorial visual · Datos ficticios · Sin voz</div></div>` },
      { html: `<div class="scene"><div class="top"><div class="brand">HOREKIA · DISEÑAR SERVICIO</div><div class="count">4 / 4</div></div><div class="instruction">Escoge los elementos para tu negocio. Puedes usar el selector de plantilla como ayuda.</div><div class="sub">Añade preguntas, conceptos de catálogo y reglas deterministas.</div><div class="shot four"><img src="video-assets/story-3-service-designer.png" /></div><div class="callout four">4 · Elige y personaliza</div><div class="footer">Tutorial visual · Datos ficticios · Sin voz</div></div>` }
    ];
    const scene = Number(new URLSearchParams(location.search).get('scene') || 0);
    document.getElementById('app').innerHTML = scenes[Math.max(0, Math.min(scene, scenes.length - 1))].html;
  </script>
</body>
</html>
